---
- name: Converge
  hosts: all
  gather_facts: true
  vars:
    nginx_repo_version: "mainline"
    nginx_custom_log_formats:
      - name: "kv"
        format: |-
          'site="$server_name" server="$host" dest_port="$server_port" dest_ip="$server_addr" '
          'src="$remote_addr" src_ip="$realip_remote_addr" user="$remote_user" '
          'time_local="$time_local" protocol="$server_protocol" status="$status" '
          'bytes_out="$bytes_sent" bytes_in="$upstream_bytes_received" '
          'http_referer="$http_referer" http_user_agent="$http_user_agent" '
          'nginx_version="$nginx_version" http_x_forwarded_for="$http_x_forwarded_for" '
          'http_x_header="$http_x_header" uri_query="$query_string" uri_path="$uri" '
          'http_method="$request_method" response_time="$upstream_response_time" '
          'cookie="$http_cookie" request_time="$request_time" category="$sent_http_content_type" https="$https"'

    nginx_vhosts:
      - listen: "80 default_server"
        server_name: "_"
        extra_parameters: |
          return 301 https://$host$request_uri;

    # nginx.org's official packages only compile the stream module
    # statically on EL; on Debian/Ubuntu/Amazon it's built as a dynamic
    # module but the .so is never actually published, so "stream {}"
    # can't work there at all. Only exercise it where it can succeed.
    nginx_streams: "{{ [{'listen': '66 udp', 'proxy_pass': 'dns_servers', 'extra_parameters': 'proxy_responses 0;\n'}] if (ansible_os_family == 'RedHat' and ansible_distribution != 'Amazon') else [] }}"
    nginx_upstreams: "{{ [{'name': 'dns_servers', 'servers': ['192.168.136.130:53', '192.168.136.131:53 weight=3']}, {'name': 'myapp', 'strategy': 'hash $remote_addr consistent', 'servers': ['192.168.136.11:8080', '192.168.136.12:8080', '192.168.136.13:8080']}] if (ansible_os_family == 'RedHat' and ansible_distribution != 'Amazon') else [] }}"


  roles:
    - role: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}"

